 <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

    <div class="collapse navbar-collapse" id="navbarColor01">

  <section class="container my-2" id="carousel">
<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="3"></button>

    <div class="carousel-item active">
      <img src="https://images.unsplash.com/photo-1576435728678-68d0fbf94e91?w=1200&h=450&fit=crop" alt="silnicka" class="d-block w-100" style="width: 1200; height: 500px;">
      <div class="carousel-caption">
        <h5>Silniční kola</h5>
      </div>
    </div>
    <div class="carousel-item">
      <img src="img/horske.jpg" alt="horske" class="d-block w-100" style="width: 1200; height: 500px;">

      </div>

    <div class="carousel-item">

      </div>
    </div>
  </div>
  
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
